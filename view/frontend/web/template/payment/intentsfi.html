<div class="payment-method" data-bind="css: {'_active': (getCode() == isChecked())}">
    <div class="payment-method-title field choice">
        <input type="radio"
               name="payment[method]"
               class="radio"
               data-bind="attr: {'id': getCode()}, value: getCode(), checked: isChecked, click: selectPaymentMethod, visible: isRadioButtonVisible()">
        <label data-bind="attr: {'for': getCode()}" class="label"><span data-bind="text: getTitle()"></span></label>
    </div>
    <div class="payment-method-content">
        <!-- ko foreach: getRegion('messages') -->
        <!-- ko template: getTemplate() --><!-- /ko -->
        <!--/ko-->

        <p class="intentsfi-checkout-total" data-bind="visible: getFormattedTotal()">
            <strong>
                <span data-bind="i18n: 'You pay'"></span>
                <span data-bind="text: getFormattedTotal()"></span>
            </strong>
        </p>
        <p data-bind="i18n: 'After you place your order, you will go to a secure page to pay with the crypto you already hold. You choose the token and network there, and see the exact amount before you send anything.'"></p>
        <p data-bind="visible: isTestMode()">
            <em data-bind="i18n: 'Test mode: no real money is taken.'"></em>
        </p>
        <p class="note">
            <span data-bind="i18n: 'Questions about a payment? Email'"></span>
            <a data-bind="attr: {href: 'mailto:' + getSupportEmail()}, text: getSupportEmail()"></a>
        </p>

        <div class="payment-method-billing-address">
            <!-- ko foreach: $parent.getRegion(getBillingAddressFormName()) -->
            <!-- ko template: getTemplate() --><!-- /ko -->
            <!--/ko-->
        </div>
        <div class="checkout-agreements-block">
            <!-- ko foreach: $parent.getRegion('before-place-order') -->
            <!-- ko template: getTemplate() --><!-- /ko -->
            <!--/ko-->
        </div>
        <div class="actions-toolbar">
            <div class="primary">
                <button class="action primary checkout"
                        type="submit"
                        data-bind="click: placeOrder, attr: {title: $t('Continue to payment')}, enable: (getCode() == isChecked()), css: {disabled: !isPlaceOrderActionAllowed()}"
                        disabled>
                    <span data-bind="i18n: 'Continue to payment'"></span>
                </button>
            </div>
        </div>
    </div>
</div>
